{{define "main" -}}
# Junocash daemon configuration
# Generated by Blockbook

# RPC settings
rpcuser={{.IPC.RPCUser}}
rpcpassword={{.IPC.RPCPass}}
rpcport={{.Ports.BackendRPC}}
rpcallowip=127.0.0.1
rpcbind=127.0.0.1

# Server settings
server=1
daemon=0
disablewallet=1
listen=0

# Index settings (required for Blockbook)
txindex=1
addressindex=1
timestampindex=1
spentindex=1

# ZMQ notifications (for real-time updates)
zmqpubhashtx={{template "IPC.MessageQueueBindingTemplate" .}}
zmqpubhashblock={{template "IPC.MessageQueueBindingTemplate" .}}

# Network and resource settings
{{if not .Backend.Mainnet}}testnet=1{{end}}
maxconnections=24
maxuploadtarget=500
peerbloomfilters=0
dbcache=128
par=1
maxorphantx=10
mempooltxcostlimit=25000000
checkblocks=24
checklevel=3

# Logging
printtoconsole=1
logtimestamps=1

{{- if .Backend.AdditionalParams}}
# generated from additional_params
{{- range $name, $value := .Backend.AdditionalParams}}
{{- if eq $name "addnode"}}
{{- range $index, $node := $value}}
addnode={{$node}}
{{- end}}
{{- else}}
{{$name}}={{$value}}
{{- end}}
{{- end}}
{{- end}}
{{end}}
